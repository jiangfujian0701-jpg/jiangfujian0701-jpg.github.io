name: privacy-migration
on:
  workflow_dispatch:
    inputs:
      passphrase:
        description: "访问口令（仅本次使用，仓库中不会保存）"
        required: true
permissions:
  contents: write
concurrency: {group: privacy-migration, cancel-in-progress: false}
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - name: 图片哈希改名 + 数据直链化
        run: python scripts/privacy_migrate.py
      - name: 加密数据并删除明文
        env: {PASS: "${{ inputs.passphrase }}"}
        run: node scripts/encrypt.mjs
      - name: 提交
        run: |
          git config user.name "YG-ops"
          git config user.email "yg-ops@users.noreply.github.com"
          git add -A
          git commit -q -m "privacy: 图片哈希改名 + 数据 AES-GCM 加密，移除明文"
          git push -q origin HEAD:main
