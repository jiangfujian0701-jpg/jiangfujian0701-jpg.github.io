name: auto-update
on:
  workflow_dispatch:
    inputs:
      max_new: {description: "本轮最多新增人数", required: false, default: "40"}
  schedule:
    - cron: "0 21 * * 0"
permissions:
  contents: write
concurrency: {group: auto-update, cancel-in-progress: false}
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - name: 解密数据
        env: {PASS: "${{ secrets.NV_PASS }}"}
        run: node scripts/decrypt.mjs
      - run: pip install --quiet pillow
      - name: 拉增量并合并
        id: sync
        env:
          NV_COOKIE: ${{ secrets.NV_COOKIE }}
          NV_HANDLE: ${{ secrets.NV_HANDLE }}
          NV_MAX_NEW: ${{ github.event.inputs.max_new || '40' }}
        run: python scripts/sync_x.py
      - name: 重新加密
        env: {PASS: "${{ secrets.NV_PASS }}"}
        run: node scripts/encrypt_plain.mjs
      - name: 提交
        run: |
          git config user.name "YG-ops"
          git config user.email "yg-ops@users.noreply.github.com"
          mkdir -p .ci && echo 0 > .ci/fail-count
          git add -A
          if git diff --cached --quiet; then echo "no change"; else
            git commit -q -m "auto: 新增 ${{ steps.sync.outputs.added }} / 刷新 ${{ steps.sync.outputs.updated }}（共 ${{ steps.sync.outputs.total }}）"
            git push -q origin HEAD:main
          fi
      - name: 连续失败计数（满 3 次才开 issue）
        if: failure()
        env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: |
          git config user.name "YG-ops"
          git config user.email "yg-ops@users.noreply.github.com"
          mkdir -p .ci
          N=$(cat .ci/fail-count 2>/dev/null || echo 0)
          N=$((N+1)); echo $N > .ci/fail-count
          git add .ci && git commit -q -m "ci: 同步失败计数 $N" && git push -q origin HEAD:main || true
          if [ "$N" -ge 3 ]; then
            gh issue create --title "[sync] 自动同步连续失败 ${N} 次" \
              --body "连续失败，请检查 cookie / 接口变化 / 日志。" || true
          fi
