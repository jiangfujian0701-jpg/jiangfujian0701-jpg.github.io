name: android-apk
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android-apk.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: 安装 Android SDK 组件
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" >/dev/null
      - name: 构建 APK
        run: |
          cd android
          curl -sSLO https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          ./gradle-8.7/bin/gradle assembleDebug --no-daemon --console=plain
      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: 女菩萨画廊 · 套壳 APK
          body: |
            自动构建于 ${{ github.sha }}
            安装：下载 app-debug.apk → 允许未知来源 → 安装
          files: android/app/build/outputs/apk/debug/app-debug.apk
