name: cross-mine
on:
  workflow_dispatch:
  schedule:
    - cron: "30 21 * * 0"
permissions:
  contents: write
concurrency: {group: cross-mine, cancel-in-progress: false}
jobs:
  mine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - run: pip install --quiet pillow
      - name: 解密
        env: {PASS: "${{ secrets.NV_PASS }}"}
        run: node scripts/decrypt.mjs
      - name: 交叉挖掘
        env:
          NV_COOKIE: ${{ secrets.NV_COOKIE }}
          NV_SEEDS: "10"
          NV_MINE_MAX: "15"
        run: python scripts/mine_related.py
      - name: 重新加密
        env: {PASS: "${{ secrets.NV_PASS }}"}
        run: node scripts/encrypt_plain.mjs
      - name: 提交
        run: |
          git config user.name "YG-ops"
          git config user.email "yg-ops@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no change"; else
            git commit -q -m "auto(mine): 交叉挖掘新增同类创作者"
            git push -q origin HEAD:main
          fi
