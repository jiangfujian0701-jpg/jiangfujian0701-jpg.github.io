<!DOCTYPE html>
<html lang="zh-CN" data-theme="oled"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>运维面板 · 女菩萨画廊</title><link rel="icon" href="/logo-icon.png">
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#000000">
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#e8e8ea;font-family:"Plus Jakarta Sans",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:20px 16px 60px}
a{color:#7c8cff}.wrap{max-width:820px;margin:0 auto}h1{font-size:20px;margin:0 0 4px}
.sub{color:#8b8b93;font-size:12px;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.card{background:#0d0d10;border:1px solid #1e1e24;border-radius:14px;padding:14px}
.card .k{color:#8b8b93;font-size:11px;letter-spacing:.4px}.card .v{font-size:22px;font-weight:700;margin-top:6px}
.sec{background:#0d0d10;border:1px solid #1e1e24;border-radius:14px;padding:16px;margin-bottom:14px}
.sec h2{font-size:14px;margin:0 0 10px;color:#c9c9d2}.row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #16161b;font-size:13px}
.row:last-child{border:0}.row span:last-child{color:#a5a5b0;font-variant-numeric:tabular-numeric}
.ok{color:#4ade80}.warn{color:#fbbf24}.btn{display:inline-block;background:#1a1a22;border:1px solid #2a2a35;color:#e8e8ea;padding:8px 14px;border-radius:10px;font-size:13px;text-decoration:none;margin:4px 6px 0 0}
code{background:#14141a;padding:1px 5px;border-radius:5px;font-size:12px}
table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:6px 4px;border-bottom:1px solid #16161b;text-align:left}th{color:#8b8b93;font-weight:500}
</style></head><body><div class="wrap">
<h1>运维面板</h1><div class="sub">女菩萨 · X 博主精选画廊 — 静态镜像 + AI 运维（YG 全权代理）</div>
<div class="grid" id="cards"></div>
<div class="sec"><h2>资源自主化</h2><div id="assets">读取中…</div></div>
<div class="sec"><h2>数据构成</h2><div id="stats">读取中…</div></div>
<div class="sec"><h2>粉丝 Top 10</h2><table id="top"><thead><tr><th>#</th><th>Handle</th><th>昵称</th><th>粉丝</th><th>状态</th></tr></thead><tbody></tbody></table></div>
<div class="sec"><h2>怎么更新</h2>
<div class="row"><span>数据 / 内容 / 样式改动</span><span>在聊天里跟 AI 说一句，AI 提交并自动发布</span></div>
<div class="row"><span>图片与数据快照</span><span>Actions 每日 04:30 (UTC+8) 自动巡检补齐</span></div>
<div class="row"><span>手动触发镜像任务</span><span><code>workflow: mirror-assets</code></span></div>
<div class="row"><span>源码主仓</span><span><code>DSH-Go-</code> / docs（私有）</span></div>
<div class="row"><span>发布出口</span><span><code>jiangfujian0701-jpg.github.io</code>（公开）</span></div>
<a class="btn" href="/">← 返回画廊</a><a class="btn" href="/admin-legacy/">原站后台（留档）</a>
</div>
<script>
const fmt=n=>(n||0).toLocaleString('zh-CN');
(async()=>{
 let data=[],ops={};
 try{data=await (await fetch('/data/archive.json?t='+Date.now())).json()}catch(e){}
 try{ops=await (await fetch('/ops-status.json?t='+Date.now())).json()}catch(e){}
 const ver=data.filter(d=>d.verified).length, lost=data.filter(d=>d.is_suspended||d.is_blocked).length;
 const top50=data.filter(d=>(d.followers_count||0)>=500000).length, top10=data.filter(d=>(d.followers_count||0)>=100000).length;
 const clicks=data.reduce((a,b)=>a+(b.total_clicks||0),0);
 document.getElementById('cards').innerHTML=[
  ['归档博主',fmt(data.length)],['蓝标认证',fmt(ver)],['赛博坟场',fmt(lost)],['累计点击',fmt(clicks)],
  ['10万+',fmt(top10)],['50万+',fmt(top50)]
 ].map(c=>`<div class="card"><div class="k">${c[0]}</div><div class="v">${c[1]}</div></div>`).join('');
 const imgOk=ops.images_local||0, imgAll=ops.images_total||0;
 const pct=imgAll?Math.round(imgOk/imgAll*100):0;
 document.getElementById('assets').innerHTML=`
  <div class="row"><span>本地化图片</span><span class="${pct>=99?'ok':'warn'}">${fmt(imgOk)} / ${fmt(imgAll)}（${pct}%）</span></div>
  <div class="row"><span>数据快照时间</span><span>${ops.snapshot_at||'—'}</span></div>
  <div class="row"><span>最近一次镜像任务</span><span>${ops.generated_at||'尚未运行'}</span></div>
  <div class="row"><span>仓库体积</span><span>${ops.repo_mb?ops.repo_mb+' MB':'—'}</span></div>
  <div class="row"><span>外部依赖</span><span class="${ops.self_hosted?'ok':'warn'}">${ops.self_hosted?'无（全站自托管）':'仍依赖原站 R2'}</span></div>`;
 const fc=data.map(d=>d.followers_count||0).sort((a,b)=>b-a);
 const med=fc[Math.floor(fc.length/2)]||0;
 document.getElementById('stats').innerHTML=`
  <div class="row"><span>粉丝最高</span><span>${fmt(fc[0])}</span></div>
  <div class="row"><span>粉丝中位数</span><span>${fmt(med)}</span></div>
  <div class="row"><span>归档时间跨度</span><span>${(data.map(d=>d.backed_up_at||'').sort()[0]||'').slice(0,10)} → ${(data.map(d=>d.backed_up_at||'').sort().slice(-1)[0]||'').slice(0,10)}</span></div>`;
 document.querySelector('#top tbody').innerHTML=data.slice().sort((a,b)=>(b.followers_count||0)-(a.followers_count||0)).slice(0,10)
  .map((d,i)=>`<tr><td>${i+1}</td><td><a href="https://x.com/${d.screen_name}" target="_blank">@${d.screen_name}</a></td>
   <td>${(d.name||'').slice(0,14)}</td><td>${fmt(d.followers_count)}</td>
   <td class="${d.is_suspended?'warn':'ok'}">${d.is_suspended?'已封号':(d.verified?'蓝标':'正常')}</td></tr>`).join('');
})();
</script></div></body></html>
